<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Siri Medicals - Login</title>
  <link href="/static/style.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="vh-100 d-flex justify-content-center align-items-center">
    <div class="card p-4" style="width:420px">
      <h4 class="mb-3">Siri Medicals - Employee Login</h4>
      <input id="loginUser" class="form-control mb-2" placeholder="Username">
      <input id="loginPass" class="form-control mb-2" placeholder="Password" type="password">
      <div class="d-flex justify-content-between">
        <button class="btn btn-primary" onclick="doLogin()">Login</button>
      </div>
       </div>
  </div>

<script>
  async function doLogin(){
    const u = document.getElementById('loginUser').value, p = document.getElementById('loginPass').value;
    const res = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username:u,password:p})});
    const d = await res.json();
    if(d.success){
      localStorage.setItem('ph_emp', JSON.stringify({emp_id:d.emp_id, emp_name:d.emp_name}));
      window.location = '/dashboard';
    } else {
      alert('Login failed');
    }
  }
</script>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Dashboard - Siri Medicals</title>
  <link href="/static/style.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="topbar">
    <a href="/dashboard" class="brand"><h1 class="text-center fw-bold mt-4" style="font-size: 42px;">
    Siri Medicals
</h1>
</a>
    <div class="nav-links">
      <div class="d-flex justify-content-center gap-3 mt-4">
    <a href="/customers" class="btn btn-primary px-4">Customers</a>
    <a href="/employees" class="btn btn-primary px-4">Employees</a>
    <a href="/medicines" class="btn btn-primary px-4">Medicines</a>
    <a href="/bills" class="btn btn-primary px-4">Bills</a>
 <a href="/create_bill" class="btn btn-sm btn-success">Create Bill</a>
      <a href="/login" class="btn btn-outline-secondary btn-sm">Logout</a>
</div>

     
    </div>
  </nav>

  <main class="container mt-4">
    <h3>Dashboard</h3>
    <div class="row gy-3">
      <div class="col-md-3"><div class="stat card p-3">Customers: <span id="statCustomers">0</span></div></div>
      <div class="col-md-3"><div class="stat card p-3">Employees: <span id="statEmployees">0</span></div></div>
      <div class="col-md-3"><div class="stat card p-3">Medicines: <span id="statMedicines">0</span></div></div>
      <div class="col-md-3"><div class="stat card p-3">Low Stock: <span id="statLow">0</span></div></div>
    </div>

    <div class="row mt-4">
      <div class="col-md-6">
        <h5>Low Stock</h5>
        <div id="dashLowStock"></div>
      </div>
      <div class="col-md-6">
        <h5>Expiring Soon</h5>
        <div id="dashExpiringSoon"></div>
      </div>
    </div>
  </main>

<script src="/static/script.js"></script>
<script>
  // load dashboard data
  (async function(){
    const s = await fetch('/api/summary').then(r=>r.json());
    document.getElementById('statCustomers').textContent = s.customers;
    document.getElementById('statEmployees').textContent = s.employees;
    document.getElementById('statMedicines').textContent = s.medicines;
    document.getElementById('statLow').textContent = s.low_stock;
    // load low/expiring
    const low = await fetch('/api/lowstock').then(r=>r.json());
    let html = '<table class="table table-sm"><tr><th>ID</th><th>Name</th><th>Qty</th></tr>';
    low.forEach(r => html += `<tr><td>${r.medicine_id}</td><td>${r.medicine_name}</td><td>${r.quantity}</td></tr>`);
    html += '</table>'; document.getElementById('dashLowStock').innerHTML = html;
    const soon = await fetch('/api/expiring_soon').then(r=>r.json());
    let html2 = '<table class="table table-sm"><tr><th>ID</th><th>Name</th><th>Expiry</th></tr>';
    soon.forEach(r => html2 += `<tr><td>${r.medicine_id}</td><td>${r.medicine_name}</td><td>${r.expiry_date||""}</td></tr>`);
    html2 += '</table>'; document.getElementById('dashExpiringSoon').innerHTML = html2;
  })();
</script>
</body>
</html>

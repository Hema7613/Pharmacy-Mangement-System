<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Medicines - Siri Medicals</title>
  <link href="/static/style.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<a href="/dashboard" class="brand"><h1 class="text-center fw-bold mt-4" style="font-size: 42px;">
    Siri Medicals
</h1>
</a>

  <div class="nav-links">
      <div class="d-flex justify-content-center gap-3 mt-4">
    <a href="/customers" class="btn btn-primary px-4">Customers</a>
    <a href="/employees" class="btn btn-primary px-4">Employees</a>
    <a href="/medicines" class="btn btn-primary px-4">Medicines</a>
    <a href="/bills" class="btn btn-primary px-4">Bills</a>
 <a href="/create_bill" class="btn btn-sm btn-success">Create Bill</a>
      <a href="/login" class="btn btn-outline-secondary btn-sm">Logout</a>
</div>

     
    </div>
  </nav>


  <main class="container mt-4">
    <h3>Medicines</h3>
    <div class="row">
      <div class="col-md-7">
        <h5>List</h5>
        <div id="medList"></div>
      </div>
      <div class="col-md-5">
        <h5>Add Medicine</h5>
        <div class="card p-3">
          <input id="medName" class="form-control mb-2" placeholder="Medicine name">
          <input id="medQty" class="form-control mb-2" placeholder="Quantity" type="number">
          <input id="medPrice" class="form-control mb-2" placeholder="Price" type="number" step="0.01">
          <input id="medExpiry" class="form-control mb-2" placeholder="Expiry date" type="date">
          <button class="btn btn-success" onclick="addMedicineForm()">Add Medicine</button>
        </div>
      </div>
    </div>
  </main>

<script src="/static/script.js"></script>
<script>
  async function addMedicineForm(){
    const name = document.getElementById('medName').value.trim();
    const qty = parseInt(document.getElementById('medQty').value || 0);
    const price = parseFloat(document.getElementById('medPrice').value || 0);
    const expiry = document.getElementById('medExpiry').value || null;
    if(!name){ alert('Name required'); return; }
    const res = await fetch('/api/medicines', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({medicine_name:name, quantity:qty, price:price, expiry_date: expiry})});
    const d = await res.json();
    if(d.success){ alert('Medicine added'); document.getElementById('medName').value=''; document.getElementById('medQty').value=''; document.getElementById('medPrice').value=''; document.getElementById('medExpiry').value=''; loadMedicines(); } else alert('Error: ' + (d.error||'unknown'));
  }

  async function loadMedicines(){
    const rows = await fetch('/api/medicines').then(r=>r.json());
    let html = '<table class="table table-sm"><tr><th>ID</th><th>Name</th><th>Qty</th><th>Price</th><th>Expiry</th></tr>';
    rows.forEach(r => html += `<tr><td>${r.medicine_id}</td><td>${r.medicine_name}</td><td>${r.quantity}</td><td>${r.price}</td><td>${r.expiry_date||''}</td></tr>`);
    html += '</table>'; document.getElementById('medList').innerHTML = html;
  }
  loadMedicines();
</script>
</body>
</html>
